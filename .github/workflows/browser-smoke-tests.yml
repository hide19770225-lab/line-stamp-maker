name: Chromium browser smoke tests
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Start local server and run browser tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/stamp-http.log 2>&1 &
          npx playwright test tests/browser-counts.spec.cjs tests/browser-image.spec.cjs --workers=1 --reporter=line --timeout=240000
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
