name: Sticker count regression tests
on:
  pull_request:
    paths:
      - 'project.js'
      - 'tests/counts.test.js'
      - '.github/workflows/sticker-count-tests.yml'
  push:
    branches: [main]
    paths:
      - 'project.js'
      - 'tests/counts.test.js'
      - '.github/workflows/sticker-count-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/counts.test.js
