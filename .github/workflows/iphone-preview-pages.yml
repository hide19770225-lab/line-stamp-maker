name: PR 67 iPhone preview build (artifact only)
on:
  workflow_dispatch:
  push:
    branches:
      - preview/pr-67-iphone-safari
permissions:
  contents: read
jobs:
  preview-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static preview
        run: |
          mkdir -p _site
          tar --exclude=.git --exclude=.github --exclude=_site --exclude=node_modules --exclude=tests --exclude=docs -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: pr67-iphone-preview-site
          path: _site
          if-no-files-found: error
