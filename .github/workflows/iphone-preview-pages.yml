name: PR 67 iPhone Safari preview
on:
  workflow_dispatch:
  push:
    branches:
      - preview/pr-67-iphone-safari
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: iphone-preview-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static preview
        run: |
          mkdir -p _site
          tar --exclude=.git --exclude=.github --exclude=_site --exclude=node_modules --exclude=tests --exclude=docs -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
