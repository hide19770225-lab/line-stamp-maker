name: Framed grid regression
on:
  push:
    branches:
      - feature/framed-40-grid
  workflow_dispatch:
  pull_request:
    paths:
      - 'core.js'
      - 'app.js'
      - 'tests/framed-grid*'
      - '.github/workflows/framed-grid.yml'
permissions:
  contents: read
jobs:
  framed-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check app.js
      - name: Run framed-grid regression
        run: node tests/framed-grid.test.cjs
      - name: Install Chromium test tools
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify framed cropping in real Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')" node tests/framed-grid-browser.cjs
